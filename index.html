<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>LeetCode Solutions — 题解</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="description"
      content="LeetCode 题解仓库在线文档：Hot 100 等 C++ / Java 题解" />
    <meta name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0" />
    <link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/dist/style.min.css" />
    <style>
    :root {
      --theme-color: #2563eb;
    }
    .markdown-section pre > code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 0.9em;
      line-height: 1.5;
    }
    .sidebar-nav > ul > li > a {
      font-weight: 600;
    }
  </style>
  </head>
  <body>
    <div id="app">加载中…</div>
    <script>
    // 保证 GitHub Pages 项目站带尾部斜杠，避免相对路径解析失败
    (function () {
      var path = location.pathname;
      if (
        location.hostname.endsWith("github.io") &&
        path === "/leetcode-solutions"
      ) {
        location.replace("/leetcode-solutions/" + location.search + location.hash);
      }
    })();

    window.$docsify = {
      name: "LeetCode Solutions",
      repo: "https://github.com/jinzcdev/leetcode-solutions",
      homepage: "README.md",
      loadSidebar: true,
      auto2top: true,
      maxLevel: 3,
      subMaxLevel: 3,
      relativePath: false,
      alias: {
        "/.*/_sidebar.md": "_sidebar.md",
      },
      search: {
        paths: "auto",
        placeholder: "搜索文档",
        noData: "未找到结果",
        depth: 4,
      },
      copyCode: {
        buttonText: "复制",
        errorText: "失败",
        successText: "已复制",
      },
      pagination: {
        previousText: "上一篇",
        nextText: "下一篇",
        crossChapter: true,
        crossChapterText: true,
      },
      darklightTheme: {
        defaultTheme: 'light',
      },
    };
  </script>
    <script
      src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2/dist/docsify-copy-code.min.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/docsify-pagination@2/dist/docsify-pagination.min.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/dist/index.min.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-c.min.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-cpp.min.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-java.min.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
  </body>
</html>
